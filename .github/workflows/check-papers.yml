name: Check paper list

on:
  push:
    paths: ["data/**", "scripts/**"]
  pull_request:
    paths: ["data/**", "scripts/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/add_paper.py --check
      - run: python3 scripts/build_graph.py --check
      - run: python3 scripts/build_bibtex.py --check
